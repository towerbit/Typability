[package]
name = "typability"
version = "0.6.9"
description = "a WYSIWYG markdown editor based on Milkdown."
authors = ["SimonShiki"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.2.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6.8", features = ["app-all", "dialog-all", "fs-all", "os-all", "path-all", "process-relaunch-dangerous-allow-symlink-macos", "shell-open", "window-all"] }
window-vibrancy = "0.4.3"
window-shadows = "0.2.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.19"
windows = "0.39"
base64 = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
cocoa = "0.24"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.15"
webkit2gtk = { version = "0.18.2", features = ["v2_22"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
#default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
opt-level = "z"  # Optimize for size.
codegen-units = 1
strip = true  # Automatically strip symbols from the binary.
lto = true # Enables link to optimizations
